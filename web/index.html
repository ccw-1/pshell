<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pshell - Web Terminal</title>
    <link rel="stylesheet" href="lib/xterm.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐚 pshell</h1>
            <div class="header-controls">
                <button id="new-session-btn" class="btn btn-primary">New Session</button>
                <button id="refresh-btn" class="btn">Refresh</button>
                <span id="status" class="status">●</span>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar: Session List -->
            <aside class="sidebar">
                <h2>Sessions</h2>
                <div id="session-list" class="session-list">
                    <div class="empty-state">No sessions</div>
                </div>
            </aside>

            <!-- Main: Terminal Display -->
            <main class="terminal-container">
                <div id="terminal-header" class="terminal-header" style="display: none;">
                    <div class="terminal-info">
                        <span id="terminal-title">Session</span>
                        <span id="terminal-size" class="terminal-size"></span>
                    </div>
                    <div class="terminal-controls">
                        <button id="clear-btn" class="btn btn-sm">Clear</button>
                        <button id="resize-btn" class="btn btn-sm">Resize</button>
                        <button id="close-btn" class="btn btn-sm btn-danger">Close</button>
                    </div>
                </div>
                
                <div id="terminal" class="terminal">
                    <div class="welcome-screen">
                        <h2>Welcome to pshell</h2>
                        <p>Create a new session or select an existing one to get started.</p>
                    </div>
                </div>

                <div id="terminal-input" class="terminal-input" style="display: none;">
                    <input type="text" id="command-input" placeholder="" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                </div>
            </main>
        </div>
    </div>

    <!-- New Session Modal -->
    <div id="new-session-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Session</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="session-command">Command:</label>
                    <input type="text" id="session-command" value="bash" placeholder="bash, sh, python, etc.">
                </div>
                <div class="form-group">
                    <label for="session-rows">Rows:</label>
                    <input type="number" id="session-rows" value="24" min="10" max="100">
                </div>
                <div class="form-group">
                    <label for="session-cols">Columns:</label>
                    <input type="number" id="session-cols" value="80" min="40" max="200">
                </div>
            </div>
            <div class="modal-footer">
                <button id="create-session-btn" class="btn btn-primary">Create</button>
                <button class="modal-close btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Resize Modal -->
    <div id="resize-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Resize Terminal</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="resize-rows">Rows:</label>
                    <input type="number" id="resize-rows" value="24" min="10" max="100">
                </div>
                <div class="form-group">
                    <label for="resize-cols">Columns:</label>
                    <input type="number" id="resize-cols" value="80" min="40" max="200">
                </div>
            </div>
            <div class="modal-footer">
                <button id="resize-confirm-btn" class="btn btn-primary">Resize</button>
                <button class="modal-close btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="lib/xterm.js"></script>
    <script src="lib/xterm-addon-fit.js"></script>
    <script src="lib/xterm-addon-web-links.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/xterm-terminal.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
