# pshell configuration

[daemon]
log_file = /tmp/pshell.log
log_level = info
use_syslog = false
pid_file = /tmp/pshell.pid

[http]
enabled = false
bind_address = 127.0.0.1
port = 8080
# Web interface directory. Use "web" when running from the source tree, or
# /usr/local/share/pshell/web after "sudo make install".
static_dir = web

[sessions]
max_sessions = 100
max_attach = 16              # terminals per session (pshellctl attach), 1-256
default_shell = /bin/bash

[socket]
enabled = true
socket_path = /tmp/pshell.sock
socket_permissions = 0600

# Authentication for REST API (optional, disabled by default)
# Generate a secure key with: pshellctl generate-key
# [auth]
# enabled = true
# api_keys = <your-generated-key-here>
