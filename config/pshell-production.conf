[daemon]
pid_file = /var/run/pshell.pid
log_file = /var/log/pshell.log
log_level = info
use_syslog = true

[http]
# Enable HTTP REST API and web interface (default: false)
# WARNING: On multi-user systems, disable HTTP as spawned shells run with
# the daemon owner's security context. Use Unix socket interface instead.
# Only enable HTTP for single-user development or when proper authentication
# and authorization mechanisms are in place.
enabled = false
port = 8080
bind_address = 127.0.0.1

[socket]
# Enable Unix socket interface (default: true)
# Recommended for multi-user systems - uses file permissions for access control
# Socket permissions: 0600 = owner only, 0660 = owner+group, 0666 = all users
enabled = true
socket_path = /var/run/pshell.sock
socket_permissions = 0600

[sessions]
max_sessions = 100
max_attach = 16              # terminals per session (pshellctl attach), 1-256
session_timeout = 3600
default_shell = /bin/bash

# Authentication for REST API (optional, disabled by default)
# Only relevant when HTTP is enabled
# Generate a secure key with: pshellctl generate-key
# [auth]
# enabled = true
# api_keys = <your-generated-key-here>
