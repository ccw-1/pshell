[daemon]
pid_file = /tmp/pshell.pid
log_file = /tmp/pshell.log
log_level = debug
use_syslog = false

[http]
port = 8080
bind_address = 127.0.0.1



[sessions]
max_sessions = 100
session_timeout = 3600
default_shell = /bin/bash

# Authentication for REST API (optional, disabled by default)
# Generate a secure key with: pshellctl generate-key
# [auth]
# enabled = true
# api_keys = <your-generated-key-here>
